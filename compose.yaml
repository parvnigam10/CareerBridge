name: careerbridge
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: careerbridge
      POSTGRES_USER: careerbridge
      POSTGRES_PASSWORD: ${DB_PASSWORD:-local-demo-db-password}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U careerbridge -d careerbridge"]
      interval: 5s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
  ai:
    build: ./ai-service
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 20
  backend:
    build: ./backend
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/careerbridge
      DB_USER: careerbridge
      DB_PASSWORD: ${DB_PASSWORD:-local-demo-db-password}
      JWT_SECRET: ${JWT_SECRET:-local-docker-demo-secret-change-before-deployment}
      FRONTEND_URL: http://localhost:5173
      UPLOAD_DIR: /app/data/resumes
      SEED_DEMO: ${SEED_DEMO:-true}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-Demo@12345}
      REDIS_ENABLED: "true"
      REDIS_HOST: redis
      AI_SERVICE_URL: http://ai:8000
      MAIL_ENABLED: ${MAIL_ENABLED:-false}
      MAIL_FROM: ${MAIL_FROM:-careerbridge@example.com}
      SMTP_HOST: ${SMTP_HOST:-localhost}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_AUTH: ${SMTP_AUTH:-true}
      SMTP_TLS: ${SMTP_TLS:-true}
    volumes:
      - resume-data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ai:
        condition: service_healthy
  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:5173:80"
    depends_on:
      - backend
volumes:
  postgres-data:
  resume-data:
