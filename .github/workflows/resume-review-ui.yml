name: Resume review browser checks
on:
  pull_request:
    paths:
      - 'frontend/src/ResumeStudio.jsx'
      - 'frontend/src/StudentPages.jsx'
      - 'frontend/src/style.css'
      - 'frontend/tests/resume-review-smoke.cjs'
      - 'backend/src/main/java/com/parvnigam/careerbridge/Resume*.java'
      - 'backend/src/main/java/com/parvnigam/careerbridge/Model.java'
      - 'backend/src/main/java/com/parvnigam/careerbridge/Repositories.java'
      - 'backend/src/main/java/com/parvnigam/careerbridge/CareerBridgeApplication.java'
      - '.github/workflows/resume-review-ui.yml'
permissions:
  contents: read
jobs:
  resume-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: sh mvnw -B package -DskipTests
        working-directory: backend
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run test:resumes
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: resume-review-checks
          path: frontend/target/resume-review-checks
          retention-days: 7
