spring.application.name=careerbridge
server.port=${PORT:8081}
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/careerbridge;MODE=PostgreSQL;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.data.redis.repositories.enabled=false
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
server.error.include-message=never
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=never
management.health.redis.enabled=${REDIS_ENABLED:false}
management.health.mail.enabled=${MAIL_ENABLED:false}
app.jwt-secret=${JWT_SECRET:local-demo-secret-change-before-deployment-2026}
app.frontend-url=${FRONTEND_URL:http://localhost:5173}
app.upload-dir=${UPLOAD_DIR:./data/resumes}
app.seed-demo=${SEED_DEMO:true}
app.demo-password=${DEMO_PASSWORD:Demo@12345}
app.mail-enabled=${MAIL_ENABLED:false}
app.mail-from=${MAIL_FROM:careerbridge@example.com}
spring.mail.host=${SMTP_HOST:localhost}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USER:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_TLS:true}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
app.redis-enabled=${REDIS_ENABLED:false}
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.connect-timeout=1s
spring.data.redis.timeout=1s
app.ai-url=${AI_SERVICE_URL:}


# Local inbox is opt-in and binds to loopback only. Never enable on a shared server.
app.local-email-testing=${LOCAL_EMAIL_TESTING:false}
app.local-inbox-port=${LOCAL_INBOX_PORT:8025}
app.verification-hours=24
spring.mail.properties.mail.smtp.writetimeout=5000
